[project]
name = "vistra-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "httpx>=0.27",
  "google-genai>=1.0",
  "beautifulsoup4>=4.12",
  "markdown-it-py>=3.0",
  "langchain-core>=1.8.0",
  "langchain-google-genai>=4.5.0",
  "langchain-openai>=1.8.0",
  "langgraph>=1.2.22",
  "langgraph-checkpoint-postgres>=3.2.1",
  "psycopg[binary,pool]>=3.3.9",
  "redis>=8.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP017"]
