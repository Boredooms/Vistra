name: release
# Push a tag like v0.1.1 to publish @vistra/ghost-cursor and @vistra/sdk-core to npm and attach the extension zip.
# Needs repo secret NPM_TOKEN: an npm *granular* access token with read+write on the @vistra scope and
# "bypass two-factor authentication" enabled (classic/2FA tokens stop at a browser approval prompt).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vistra/ghost-cursor --filter @vistra/sdk-core run build
      - name: Publish (skips versions already on npm)
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          for p in ghost-cursor sdk-core; do
            cd packages/$p
            v=$(node -p "require('./package.json').version")
            if npm view "@vistra/$p@$v" version >/dev/null 2>&1; then echo "@vistra/$p@$v already published"; else pnpm publish --access public --no-git-checks --provenance; fi
            cd ../..
          done

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vistra/extension run build
      - run: cd apps/extension/dist && zip -r ../vistra-extension.zip .
      - uses: actions/upload-artifact@v4
        with: { name: vistra-extension, path: apps/extension/vistra-extension.zip }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: apps/extension/vistra-extension.zip }
