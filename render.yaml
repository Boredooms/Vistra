# Render blueprint for the VISTRA API. Secrets (sync: false) are entered in the Render dashboard.
services:
  - type: web
    name: vistra-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /readyz
    autoDeploy: false
    envVars:
      - { key: APP_ENV, value: production }
      - { key: API_VERSION, value: v1 }
      - { key: AI_PRIMARY_PROVIDER, value: gemini }
      - { key: AI_FALLBACK_PROVIDER, value: nvidia }
      - { key: AI_PROVIDER_MODE, value: live }
      - { key: AI_ALLOW_FAULT_INJECTION, value: "true" } # demo beat 5 only; remove for real production
      - { key: GEMINI_MODEL_DEFAULT, value: gemini-3.5-flash }
      - { key: GEMINI_MODEL_FAST, value: gemini-3.5-flash-lite }
      - { key: GEMINI_MODEL_EMBEDDING, value: gemini-embedding-001 }
      - { key: GEMINI_EMBEDDING_DIM, value: "768" }
      - { key: NVIDIA_BASE_URL, value: "https://integrate.api.nvidia.com/v1" }
      - { key: NVIDIA_MODEL_DEFAULT, value: nvidia/nemotron-3.5-lightning-30b-a3b }
      - { key: STORAGE_PROVIDER, value: supabase }
      - { key: RATE_LIMIT_ENABLED, value: "true" }
      - { key: WORKER_EMBEDDED, value: "true" } # ingestion worker in-process; set false when running vistra-worker
      - { key: REDIS_URL, sync: false }
      - { key: CLERK_SECRET_KEY, sync: false }
      - { key: CLERK_ISSUER, sync: false }
      - { key: CLERK_JWKS_URL, sync: false }
      - { key: LOG_LEVEL, value: INFO }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      - { key: APP_URL, sync: false }
      - { key: API_URL, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_PUBLISHABLE_KEY, sync: false }
      - { key: SUPABASE_SECRET_KEY, sync: false }
      - { key: SUPABASE_DB_URL, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: NVIDIA_API_KEY, sync: false }
      - { key: TOOL_SIGNING_SECRET, sync: false }
      - { key: ENCRYPTION_KEY, sync: false }
